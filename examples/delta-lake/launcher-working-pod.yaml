apiVersion: v1
kind: Pod
metadata:
  name: working
  namespace: data-platform
spec:
  serviceAccountName: spark-driver
  restartPolicy: Never
  containers:
    - name: working
      image: mi-data-working:3.5.7
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -c
        - sleep infinity
      env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: lakehouse-s3
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: lakehouse-s3
              key: AWS_SECRET_ACCESS_KEY
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 3Gi
